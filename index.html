<!-- REACTIVE ON object in VUE 
 we don't have to use attributes like .value if we are using reactive instead of ref -->

<!DOCTYPE html>
<html>
  <head> 
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- using vue from cdn on vuejs.org websiste  -->

    <!-- we are using composition vue api-->
  </head>
  <body>
    <div id="app">
      <h1> {{getMessage()}}</h1> <!--if we want to use message then createApp has to be mounted to div-->
      <p> Lucky Number : {{luckyNumber}}</p>
      <p> Lucky Number is an {{luckyNumber%2 === 0 ? 'even' : 'odd'}}</p>
      <p> Employee : {{employee}}</p>
      <p>{{updateLuckyNumber()}}</p>
    </div>

  </body> 
  <script>
    // any vue code will be inside this script tag
    // initialize vue app from the library we imported from cdn
    const { createApp, ref , reactive } = Vue; // importing createApp function from Vue library
    createApp({
      setup() { // in compostion api everything is done inside this setup function 
        const message = "Hello  Vue 3!";
        let luckyNumber = ref(6);
        const luckyNumbers = [1, 2, 3, 4 ];

        const employee = reactive({
          name: "John",
          age: 30,
          salary: 50000,
        });

        function getMessage() {
          return message.toUpperCase();
        }

        function updateLuckyNumber() {
          setTimeout(() => {
            luckyNumber.value = Math.floor(Math.random() * 10) + 1;
            employee.salary = 60000;   //employee.salary not employee.salary.value because employee is a reactive object and we need to access the property directly to get the actual value of the employee object
          }, 2000);
        }
 
        return {
          luckyNumber,
          luckyNumbers,
          employee,
          getMessage,
          updateLuckyNumber
           
        } ;

      },
    }).mount("#app"); // mounting the vue app to the div with id app;
  </script>
</html>
