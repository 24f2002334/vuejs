<!-- ARRAY OF CLASSES AND CUSTOM STYLE  style IN VUE -->

<!DOCTYPE html>
<html>
  <head> 
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- using vue from cdn on vuejs.org websiste  -->

    <!-- we are using composition vue api-->
  </head>
  <body>
    <div id="app">
      <!-- vue app will be mounted here -->

      <!-- <div style="background-color: aqua; font-size: 40px;">Hello World</div> -->

      <div v-bind:style="{backgroundColor: 'aqua', fontSize: fontSizeTemp + 'px'}">
        Hello World
      </div> <!-- camelcase key then colons and then value in quotes -->

      <div v-bind:style="{'background-color': 'aqua', 'font-size': '40px'}">
        Hello World
      </div>   <!-- "{'key':'value','':''}" -->

      <span class="padding-medium" v-bind:class="{h1:isMaintitle(), 'bg-green': true }" > Random Text</span>
      <br></br>
      <span class="padding-medium" v-bind:class="MainTitle"> Random Text</span>
    
      <span class="padding-medium" v-bind:class="[ isMaintitle() ? MainTitle : '', borderClass]">
         Random Text
      </span>

      <br/> <br/>
      <span v-bind:style="someStyle.style1">
         Random Style Binding
      </span>
   
    </div>
     

  </body> 
  <script>
    // any vue code will be inside this script tag
    // initialize vue app from the library we imported from cdn
    const { createApp, ref , reactive , onMounted } = Vue; // importing createApp function from Vue library
    const fontSizeTemp = 60;
    
    createApp({
      setup() { // in compostion api everything is done inside this setup function 
        
        const MainTitle = {
          h1: true,
          'bg-grey': true
        };
        

        const borderClass= {
        
          border: true
        };
        const someStyle = {
          style1:{
            fontSize: '40px',
            backgroundColor: 'blue',
            margin: '20px',
            border: '1px solid black'
          },
          fontSize: "40px",
          backgroundColor: 'lightgreen',
          margin: '20px',
          border: '1px solid black'
        };

        function isMaintitle() {
          return false;
        }
        function HasGreenBackground() {
          return false;
        }

        return {
          fontSizeTemp,
          MainTitle,
          borderClass,
          isMaintitle,
          HasGreenBackground,
          someStyle
           
        } ;

      },
    }).mount("#app"); // mounting the vue app to the div with id app;
  </script>

  <style>
    .h1{
      font-size: 20px;
      color: green;
    }
    .h2{
      font-size: 20px;
      color: chocolate;
    }
    .bg-grey{
      background-color: grey;
    }
    .bg-green{
      background-color: lightgreen;
    }
    .padding-medium{
      padding: 10px;
    }
    .border{
      border: 1px solid red;
    }
  </style>
</html>
