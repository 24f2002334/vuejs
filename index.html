<!DOCTYPE html>
<html>
  <head> 
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- using vue from cdn on vuejs.org websiste  -->

    <!-- we are using composition vue api-->
  </head>
  <body>
    <div id="app">
      <span v-html="getMessage()"></span>
      <p> Lucky Number : {{luckyNumber}}</p>
      <p v-once> Rendered once lucky number : {{luckyNumber}}</p>
      <p> Lucky Number is an {{luckyNumber%2 === 0 ? 'even' : 'odd'}}</p>
      <p> Employee : {{employee}}</p>
      <!-- <p> Blog URL : <a :href="blogurl" target="_blank">Vue.js Guide</a></p>
      <a href="https://vuejs.org/guide/introduction.html" target="_blank">Vue.js Guide</a>
      <br><br>
      <a href="{{blogurl}}" >  Guide</a>  
       // this will not work because we are using vuejs and we need to use v-bind directive to bind the value of blogurl to the href attribute of the anchor tag
                                            // this is the difference between vuejs and angularjs because in angularjs we can use {{}} to bind the value of a variable to an attribute of an element but in vuejs we need to use v-bind directive to bind the value of a variable to an attribute of an element
                                             ////this will not work because we are using mustache syntax which is used for text interpolation and not for attribute binding -->
      <br>
      <br>
      <!-- <a href="{{blogurl}}" >  BLOGURL</a>  -->
      <a v-bind:href="blogurl">BLOGURL</a>
      <!-- <p>{{updateLuckyNumber()}}</p>                          if using this then the value will get updated every time the component re-renders means it will be called and updates the value again and again-->  
    </div>

  </body> 
  <script>
    // any vue code will be inside this script tag
    // initialize vue app from the library we imported from cdn
    const { createApp, ref , reactive , onMounted } = Vue; // importing createApp function from Vue library
    createApp({
      setup() { // in compostion api everything is done inside this setup function 
        const message = "Hello  Vue 3!";
        let luckyNumber = ref(6);
        const luckyNumbers = [1, 2, 3, 4 ];
        const blogurl = "https://vuejs.org/guide/introduction.html";

        const employee = reactive({
          name: "John",
          age: 30,
          salary: 50000,
        });

        function getMessage() {
          return `<h1><u>${message}</u></h1>`;
        }

        function updateLuckyNumber() {
          setTimeout(() => {
            luckyNumber.value = Math.floor(Math.random() * 10) + 1 ;
            employee.salary = 60000;   //employee.salary not employee.salary.value because employee is a reactive object and we need to access the property directly to get the actual value of the employee object
          }, 2000);
        }

        // Run once when component mounts
        onMounted(() => {
          updateLuckyNumber();
        });
        return {
          luckyNumber,
          luckyNumbers,
          employee,
          blogurl,
          getMessage,
          updateLuckyNumber,
           
        } ;

      },
    }).mount("#app"); // mounting the vue app to the div with id app;
  </script>
</html>
